<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stone Slab — procedural Three.js</title>
<style>
  html, body { margin:0; height:100%; background:#141311; overflow:hidden; }
  #slab { position:fixed; inset:0; }
  .lil-gui { --width: 280px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.esm.js"
} }
</script>
</head>
<body>
<div id="slab"></div>
<script type="module">
  import { createStoneSlab, DEFAULT_CONFIG } from './stone-slab.js';
  import GUI from 'lil-gui';

  const CONFIG = { ...DEFAULT_CONFIG };
  const slab = createStoneSlab(document.getElementById('slab'), CONFIG);
  window.slab = slab;

  // every change regenerates geometry + textures (nothing is scaled)
  const gui = new GUI({ title: 'Stone Slab' });
  const rebuild = () => slab.update(CONFIG);
  gui.add(CONFIG, 'width', 1, 16, 0.1).name('Width').onFinishChange(rebuild);
  gui.add(CONFIG, 'height', 1, 16, 0.1).name('Height').onFinishChange(rebuild);
  gui.add(CONFIG, 'depth', 0.05, 1.5, 0.01).name('Depth').onFinishChange(rebuild);
  gui.add(CONFIG, 'edgeRoughness', 0, 0.6, 0.01).name('Edge Roughness').onFinishChange(rebuild);
  gui.add(CONFIG, 'chipSize', 0, 0.8, 0.01).name('Chip Size').onFinishChange(rebuild);
  gui.add(CONFIG, 'bevelSize', 0, 0.3, 0.005).name('Bevel Size').onFinishChange(rebuild);
  gui.add(CONFIG, 'weaveRows', 0, 12, 1).name('Weave Rows').onFinishChange(rebuild);
  gui.add(CONFIG, 'weaveTileSize', 0.2, 1.5, 0.01).name('Weave Tile Size').onFinishChange(rebuild);
  gui.add(CONFIG, 'weaveDepth', 0, 0.12, 0.001).name('Weave Depth').onFinishChange(rebuild);
  gui.add(CONFIG, 'weaveFadeStart', 0.1, 1, 0.01).name('Weave Fade').onFinishChange(rebuild);
  gui.addColor(CONFIG, 'stoneColor').name('Stone Color').onFinishChange(rebuild);
  gui.add(CONFIG, 'roughness', 0.4, 1, 0.01).name('Roughness').onFinishChange(rebuild);
  gui.add(CONFIG, 'textureScale', 0.5, 8, 0.1).name('Texture Scale').onFinishChange(rebuild);
  gui.add(CONFIG, 'seed', 1, 9999, 1).name('Seed').onFinishChange(rebuild);
  gui.add({ randomize() { CONFIG.seed = Math.floor(Math.random() * 9999) + 1; gui.controllersRecursive().forEach(c => c.updateDisplay()); rebuild(); } }, 'randomize').name('Randomize Seed');
</script>
</body>
</html>
